ap}input,select{font:inherit;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 13px;outline:none;-webkit-appearance:none;appearance:none}button{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:linear-gradient(135deg,var(--blue),#7c6fff);color:#fff}.btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--dim)}.ticker-wrap{flex:1 1 220px;position:relative}.ticker-wrap input{width:100%;font-family:var(--num);letter-spacing:.06em;padding-right:48px}.fav-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);font-size:21px;padding:4px}.fav-btn.on{color:var(--amber)}.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:var(--surface2);color:var(--dim);font-family:var(--num);font-size:12px;cursor:pointer}.avg-row{margin-top:12px;padding:12px 14px;border:1px dashed var(--border2);border-radius:10px;background:rgba(77,159,255,.04);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.avg-row label{font-size:12px;color:var(--muted)}.proxy{margin-top:12px}.proxy details{color:var(--muted);font-size:12px}.proxy summary{cursor:pointer}.proxy-inner{display:flex;gap:8px;margin-top:10px}.proxy-inner input{flex:1}.side-card{display:flex;flex-direction:column;gap:16px}.fav-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.fav-symbol{font-family:var(--num);font-weight:700;flex:1;cursor:pointer}.fav-remove{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:6px}.result-area{grid-column:1}.empty,.loading,.error{min-height:220px;display:grid;place-items:center;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:var(--r);padding:40px;color:var(--muted)}.error{border-color:rgba(248,113,113,.4);color:var(--red);background:rgba(248,113,113,.1)}.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.metric .value{font-family:var(--num);font-size:20px}.upText{color:var(--red)}.downText{color:var(--blue)}.risk{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}.risk.high{background:rgba(248,113,113,.14);color:var(--red)}.risk.mid{background:rgba(251,191,36,.14);color:var(--amber)}.risk.low{background:rgba(52,211,153,.14);color:var(--green)}.chart-card,.panel,.signal,.price-map,.avg-analysis,.news-item,.mode-panel{padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.range-btn{background:var(--surface2);border:1px solid var(--border);color:var(--dim);padding:6px 11px;border-radius:999px;font-size:12px}.range-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(77,159,255,.12)}#chartContainer{height:440px;border-radius:10px;overflow:hidden;background:rgba(2,6,23,.8)}.chart-footer{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:12px}.legend-dot{width:16px;height:3px;border-radius:999px;display:inline-block}.analysis-grid,.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.data-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:7px 0}.data-row:last-child{border-bottom:none}.key{color:var(--dim)}.val{font-family:var(--num);text-align:right}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.score-track{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:8px}.score-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.decision{margin-top:12px;padding:12px;border-radius:10px;font-weight:700}.decision.buy{background:rgba(52,211,153,.14);color:var(--green)}.decision.hold{background:rgba(251,191,36,.14);color:var(--amber)}.decision.caution{background:rgba(248,113,113,.14);color:var(--red)}.price-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.price-row:last-child{border-bottom:none}.tag{font-size:11px;font-weight:800;text-transform:uppercase}.tag.r{color:var(--red)}.tag.c{color:var(--blue)}.tag.s{color:var(--green)}.chart-comment,.mode-panel{background:rgba(77,159,255,.08);border:1px solid var(--border)}.chart-comment-title{font-size:12px;font-weight:800;margin-bottom:6px;color:#cbd5e1}.chart-comment-body,.mode-body{font-size:13px;color:var(--dim);line-height:1.7;white-space:pre-line}.mode-body b{color:#fff;font-weight:800}.fallback-note{color:var(--amber);font-weight:800;margin-bottom:10px}.news-headline{font-weight:800;margin-bottom:6px}.news-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.impact{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}.impact.high{background:rgba(248,113,113,.14);color:var(--red)}.impact.mid{background:rgba(251,191,36,.14);color:var(--amber)}.impact.low{background:rgba(52,211,153,.14);color:var(--green)}.news-summary{font-size:13px;color:var(--dim);border-top:1px solid var(--border);padding-top:8px;white-space:pre-line}.result-area,.analysis-grid,.bottom-grid,.panel,.mode-panel,.chart-comment,.price-map,.avg-analysis,.news-item{min-width:0}.mode-body,.chart-comment-body,.news-summary{overflow-wrap:anywhere;word-break:break-word}.mode-panel{overflow:hidden}#resultArea{overflow-anchor:none}@media(max-width:960px){.main-grid,.analysis-grid,.bottom-grid{grid-template-columns:1fr}.result-area <body>
<div class="app"><header class="header"><div><div class="header-title">오늘의 날씨</div><div class="header-sub">어제 미국 증시 날씨 · 봉차트 · 현재가 · 펀더멘탈 · 뉴스 요약 · 평단가 판단</div></div><div class="badge" id="statusBadge">연결 확인 중</div></header><div class="weather" id="marketWeather"><h2>AI 개요 <span id="weatherDate" style="font-size:12px;color:var(--muted);font-weight:600"></span></h2><div style="color:var(--muted);font-size:13px">어제 미국 증시 날씨를 불러오는 중...</div></div><div class="main-grid"><div class="card"><div class="card-title">종목 분석</div><div class="row"><div class="ticker-wrap"><input id="ticker" placeholder="티커 입력: TSLA, AAPL, NVDA" autocomplete="off"><button class="fav-btn" id="favToggle">☆</button></div><select id="style"><option value="balanced">균형 분석</option><option value="risk">위험 중심</option><option value="buycheck">추가매수 체크</option></select><select id="period"><option value="1">1일</option><option value="7">1주</option><option value="30">1개월</option><option value="90">3개월</option><option value="180" selected>6개월</option><option value="365">1년</option></select><select id="resolution"><option value="D" selected>일봉</option><option value="60">60분봉</option><option value="15">15분봉</option><option value="5">5분봉</option></select><button id="analyzeBtn">분석하기</button></div><div class="quick" id="quickFavs"></div><div class="avg-row"><label>내 평단가</label><input id="avgPrice" type="number" min="0" step="0.01" placeholder="예: 250.50"><button class="btn-ghost" id="saveAvg">저장</button><button class="btn-ghost" id="clearAvg">삭제</button></div><div class="proxy"><details><summary>프록시 서버 설정</summary><div class="proxy-inner"><input id="proxyUrl" placeholder="Cloudflare Worker URL"><button class="btn-ghost" id="saveProxy">저장</button><button class="btn-ghost" id="clearProxy">초기화</button></div></details></div></div><div class="card side-card"><div><div class="card-title">관심종목</div><div id="favList" style="color:var(--muted);font-size:13px">아직 즐겨찾기가 없습니다.</div></div><div><div class="card-title">상태</div><div style="font-size:12px;color:var(--muted);line-height:1.7">실시간 데이터는 프록시 서버를 통해 수집됩니다.<br>투자 조언이 아닌 리스크 점검용입니다.</div><div id="testPanel" style="margin-top:8px;font-size:12px;color:var(--muted)"></div></div></div><div class="result-area" id="resultArea"><div class="empty"><div><div style="font-size:36px;opacity:.5">CHART</div><b>분석을 시작하세요</b><br>티커를 입력하고 분석하기를 눌러주세요</div></div></div></div></div>
<script>
(function(){
'use strict';
if(!String.prototype.replaceAll){String.prototype.replaceAll=function(search,replacement){return String(this).split(search).join(replacement)}}
const DEFAULT_PROXY='https://stok-proxy.ssola58.workers.dev';
const NL='\n';
let chartInstance=null,dataSource='',resizeTimer=null,lastAnalysis=null,modeRequestSeq=0;
window.__analysisBusy=false;
const PROFILES={TSLL:['Direxion Daily TSLA Bull 2X','테슬라 2배 레버리지 ETF','high'],SOXL:['Direxion Daily SOX Bull 3X','반도체 3배 레버리지 ETF','high'],TQQQ:['ProShares UltraPro QQQ','나스닥 3배 레버리지 ETF','high'],TSLA:['Tesla','전기차/AI 성장주','high'],NVDA:['NVIDIA','AI 반도체 대형주','mid'],AAPL:['Apple','대형 기술주','mid'],MSFT:['Microsoft','클라우드/AI 대형주','mid'],AMZN:['Amazon','이커머스/클라우드','mid'],GOOGL:['Alphabet','검색/AI/클라우드','mid'],META:['Meta','소셜미디어/AI','mid'],AMD:['AMD','반도체 성장주','mid'],PLTR:['Palantir','AI 데이터 플랫폼','high'],VOO:['Vanguard S&P 500 ETF','S&P 500 ETF','low'],QQQ:['Invesco QQQ Trust','나스닥 100 ETF','mid'],SPY:['SPDR S&P 500 ETF','S&P 500 ETF','low'],DIA:['SPDR Dow Jones ETF','다우 ETF','low']};
const $=id=>document.getElementById(id);
const lower=s=>String(s||'').toLowerCase();
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(s){return String(s==null?'':s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function money(v){const n=Number(v);return Number.isFinite(n)?'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'-'}
function pct(v){const n=Number(v);return Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(2)+'%':'-'}
function stripSlash(v){v=String(v||'');while(v.endsWith('/'))v=v.slice(0,-1);return v}
function baseUrl(){return stripSlash(($('proxyUrl')&&$('proxyUrl').value.trim())||load('stock_proxy_url')||DEFAULT_PROXY)}
function proxyJson(path,params){const url=new URL(baseUrl()+path);Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));return fetch(url.toString()).then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error(t||'프록시 오류 '+r.status)});return r.json()})}
function getProfile(sym){const p=PROFILES[sym]||[sym,'미국 상장 종목','mid'];return{name:p[0],type:p[1],risk:p[2]}}
const avgKey=sym=>'avg_'+String(sym||'').toUpperCase();
function getAvgPrice(sym){const v=Number(load(avgKey(sym)));return Number.isFinite(v)&&v>0?v:null}
function setAvgPrice(sym,v){sym=String(sym||'').trim().toUpperCase();const n=Number(v);if(!sym||!Number.isFinite(n)||n<=0)return false;store(avgKey(sym),String(n));return true}
function getFavs(){try{return JSON.parse(localStorage.getItem('favs')||'[]')}catch(e){return[]}}
function saveFavs(a){store('favs',JSON.stringify(a))}
function isFav(sym){return getFavs().includes(String(sym||'').toUpperCase())}
function setFavStar(sym){const b=$('favToggle');if(!b)return;const on=sym&&isFav(sym);b.textContent=on?'★':'☆';b.classList.toggle('on',!!on)}
function toggleFav(sym){sym=String(sym||'').trim().toUpperCase();if(!sym)return;const a=getFavs();const i=a.indexOf(sym);if(i>=0)a.splice(i,1);else a.unshift(sym);saveFavs(a);renderFavs();renderQuickFavs();setFavStar(sym)}
function renderFavs(){const box=$('favList'),a=getFavs();if(!box)return;if(!a.length){box.innerHTML='<div style="color:var(--muted);font-size:13px;line-height:1.7">아직 즐겨찾기가 없습니다.<br>티커 옆 별표를 눌러 추가하세요.</div>';return}box.innerHTML=a.map(sym=>{const p=getProfile(sym);return '<div class="fav-item"><span class="fav-symbol" data-sym="'+esc(sym)+'">'+esc(sym)+'</span><span class="risk '+p.risk+'">'+(p.risk==='high'?'고위험':p.risk==='low'?'저위험':'중간')+'</span><button class="fav-remove" data-remove="'+esc(sym)+'">X</button></div>'}).join('');box.querySelectorAll('[data-sym]').forEach(el=>el.onclick=()=>{$('ticker').value=el.dataset.sym;setFavStar(el.dataset.sym);syncAvgInput(el.dataset.sym);analyze()});box.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>toggleFav(el.dataset.remove))}
function renderQuickFavs(){const box=$('quickFavs'),a=getFavs();if(!box)return;box.innerHTML=a.map(sym=>'<span class="chip" data-sym="'+esc(sym)+'">'+esc(sym)+'</span>').join('');box.querySelectorAll('[data-sym]').forEach(c=>c.onclick=()=>{$('ticker').value=c.dataset.sym;setFavStar(c.dataset.sym);syncAvgInput(c.dataset.sym);analyze()})}
function syncAvgInput(sym){if($('avgPrice'))$('avgPrice').value=getAvgPrice(sym)||''}
const fetchQuote=sym=>proxyJson('/quote',{symbol:sym});
const fetchFundamental=sym=>proxyJson('/fundamental',{symbol:sym,ts:Date.now()}).catch(e=>({error:e.message}));
function fetchCandles(sym,days,res){return proxyJson('/candles',{symbol:sym,days:days,resolution:res}).then(d=>{dataSource=d.source||'Proxy';return d.candles||[]})}
function hasAny(text,words){text=lower(text);return words.some(w=>text.includes(lower(w)))}
function newsQueryFor(sym,refreshOffset){const p=getProfile(sym);const n=Number(refreshOffset)||0;const variants=['stock news earnings','latest stock market news','analyst rating price target','earnings revenue guidance','market reaction investors','sector outlook forecast','shares rise fall why','company business update'];const v=variants[Math.floor(n/5)%variants.length];return [p.name!==sym?p.name:'',sym,p.type,v].filter(Boolean).join(' ')}
function fetchNews(sym,refreshOffset){const n=Number(refreshOffset)||0;return proxyJson('/news',{symbol:sym,query:newsQueryFor(sym,n),ts:Date.now(),refresh:n,offset:n,noCache:Date.now()}).catch(e=>[]) }
function normalizeCandles(candles){const seen={};return(candles||[]).map(x=>{const d=new Date(Number(x.time)*1000);return{timeKey:d.toISOString().slice(0,10),time:+x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close,volume:+(x.volume||0)}}).filter(x=>Number.isFinite(x.close)).sort((a,b)=>(a.timeKey||a.time)-(b.timeKey||b.time)).filter(x=>{const k=x.timeKey||x.time;if(seen[k])return false;seen[k]=true;return true})}
function movingAverage(data,n){const out=[];for(let i=n-1;i<data.length;i++){let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].close;out.push({time:data[i].timeKey,value:+(s/n).toFixed(4)})}return out}
function calcStats(candles){const d=normalizeCandles(candles);if(!d.length)return{has:false};const last=d[d.length-1],prev=d[d.length-2]||last;const highs=d.map(x=>x.high),lows=d.map(x=>x.low),vols=d.map(x=>x.volume);const ma5=d.length>=5?movingAverage(d,5).slice(-1)[0].value:null,ma20=d.length>=20?movingAverage(d,20).slice(-1)[0].value:null,ma60=d.length>=60?movingAverage(d,60).slice(-1)[0].value:null,ma120=d.length>=120?movingAverage(d,120).slice(-1)[0].value:null;const avgVol=vols.slice(-20).reduce((a,b)=>a+b,0)/Math.max(vols.slice(-20).length,1);const high20=Math.max.apply(null,highs.slice(-20)),low20=Math.min.apply(null,lows.slice(-20));const high60=d.length>=60?Math.max.apply(null,highs.slice(-60)):high20;const low60=d.length>=60?Math.min.apply(null,lows.slice(-60)):low20;const dayChange=prev.close?((last.close-prev.close)/prev.close)*100:0;let trend='혼조';if(ma20&&ma60)trend=last.close>ma20&&ma20>ma60?'상승 우위':last.close<ma20&&ma20<ma60?'하락 우위':'혼조';else if(ma20)trend=last.close>ma20?'상승 우위':'하락 우위';return{has:true,last,prev,ma5,ma20,ma60,ma120,high20,low20,high60,low60,volRatio:avgVol?last.volume/avgVol:null,drawdown:high20?((last.close-high20)/high20)*100:0,rebound:low20?((last.close-low20)/low20)*100:0,dayChange,trend}}
function supportResistance(st,current){const m20=st.ma20||current,m60=st.ma60||current,m120=st.ma120||m60;return{support1:st.has?Math.min(m20,st.low20||m20):current*.98,support2:st.has?Math.min(m60,m120,st.low60||m60,(st.low20||current)*.97):current*.92,resistance1:st.has?st.high20||current:current*1.03,resistance2:st.has?Math.min(st.high60||current,(st.high20||current)*1.15):current*1.08}}
function newsTone(news){const text=(news||[]).map(n=>n.headline||n.title||'').join(' ').toLowerCase();const neg=['drop','fall','miss','loss','cut','downgrade','plunge'].filter(w=>text.includes(w)).length;const pos=['beat','surge','raise','upgrade','growth','record','strong'].filter(w=>text.includes(w)).length;return neg>pos?'부정 우위':pos>neg?'긍정 우위':'중립'}
function normalizeNews(n){return{headline:n.headline||n.title||'',url:n.url||n.link||'',datetime:n.datetime||n.time||null,source:n.source||'News'}}
function translateHeadline(h){return String(h||'').replaceAll('Stock','주식').replaceAll('stock','주식').replaceAll('Market','시장').replaceAll('market','시장').replaceAll('Earnings','실적').replaceAll('earnings','실적')}
function classifyImpact(h){const t=lower(h);if(hasAny(t,['earnings','beat','miss','plunge','surge','record','inflation','fed','rate','gdp']))return'high';if(hasAny(t,['ai','semiconductor','chip','data center','upgrade','downgrade']))return'mid';return'low'}
function fallbackSummarize(h){const t=lower(h),lines=[];lines.push('요약: '+translateHeadline(h));lines.push(hasAny(t,['ai','chip','semiconductor'])?'의미: AI·반도체 수요 기대 반영.':hasAny(t,['earnings','report'])?'의미: 실적 기대치 비교 핵심.':'의미: 단기 투자 심리 영향 가능.');lines.push(hasAny(t,['beat','surge','growth','upgrade','strong','record'])?'주가 영향: 긍정 흐름 가능성 높음.':hasAny(t,['miss','drop','plunge','downgrade','loss','cut'])?'주가 영향: 단기 하방 압력 가능.':'주가 영향: 방향성 제한적.');return lines.join(NL)}
function parseFund(fund){const n=v=>{if(v&&typeof v==='object'){if(v.raw!=null)v=v.raw;else if(v.fmt!=null)v=String(v.fmt).replace('%','')}const x=Number(v);return Number.isFinite(x)?x:null};const pool=[];const visit=(obj,depth)=>{if(!obj||typeof obj!=='object'||depth>4)return;pool.push(obj);Object.keys(obj).forEach(k=>{if(obj[k]&&typeof obj[k]==='object')visit(obj[k],depth+1)})};visit(fund||{},0);const pick=keys=>{for(const obj of pool){for(const k of keys){if(obj&&obj[k]!=null&&obj[k]!==''&&n(obj[k])!=null)return n(obj[k])}}return null};return{per:pick(['per','pe','trailingPE','forwardPE','priceEarningsRatio','priceToEarningsRatioTTM']),roe:pick(['roe','returnOnEquity','returnOnEquityTTM','roeTTM']),eps:pick(['eps','epsTTM','trailingEps','forwardEps','netIncomePerShareTTM']),pbr:pick(['pbr','pb','priceToBook','priceToBookRatio','priceToBookRatioTTM']),debt:pick(['debt','debtToEquity','debtToEquityRatioTTM']),opm:pick(['opm','operatingMargin','operatingMargins','operatingProfitMarginTTM'])}}
function fundQuality(f){if((f.roe!=null&&f.roe>=20)||(f.opm!=null&&f.opm>=20))return'우수';if((f.roe!=null&&f.roe<10)||(f.opm!=null&&f.opm<8)||(f.eps!=null&&f.eps<=0))return'취약';return'보통'}

e if(f.opm>=12)parts.push('▶ 영업이익률 '+f.opm.toFixed(1)+'% — 양호.'+NL+'영업 수익성은 안정적. 경쟁 심화 시 마진 압박 여부 확인 필요.');else parts.push('▶ 영업이익률 '+f.opm.toFixed(1)+'% — 낮은 편.'+NL+'마진 개선 여부가 중기 주가 방향의 주요 변수.')}if(f.debt!=null){if(f.debt<80)parts.push('▶ 부채비율 '+f.debt.toFixed(1)+'% — 안정.'+NL+'재무 건전성 양호. 금리 상승 구간에서도 상대적 방어력 보유.');else if(f.debt<180)parts.push('▶ 부채비율 '+f.debt.toFixed(1)+'% — 보통.'+NL+'관리 가능한 수준. 금리 변화와 이자 비용 증가 여부 확인 필요.');else parts.push('▶ 부채비율 '+f.debt.toFixed(1)+'% — 높은 편.'+NL+'재무 레버리지 부담 존재. 실적 악화 시 리스크 부각 가능.')}const verdict=[];if((f.roe!=null&&f.roe>=20)||(f.opm!=null&&f.opm>=20))verdict.push('수익성 우수');if(f.per!=null&&f.per>=35)verdict.push('밸류 부담');if(f.eps!=null&&f.eps<=0)verdict.push('이익 안정성 주의');if(f.debt!=null&&f.debt>=180)verdict.push('재무 리스크 확인');if(verdict.length)parts.push('▶ 종합: '+verdict.join(' · ')+'.'+NL+'숫자 자체보다 다음 실적에서 성장률과 마진이 이 밸류에이션을 정당화하는지가 핵심.');return parts.join(NL+NL)}
function buildScore(p,quote,candles,news,fund){const st=calcStats(candles),tone=newsTone(news),f=parseFund(fund);let score=50;if(st.trend==='상승 우위')score+=12;if(st.trend==='하락 우위')score-=14;if(f.per!=null){if(f.per<15)score+=8;else if(f.per>30)score-=8}if(f.roe!=null){if(f.roe>=20)score+=12;else if(f.roe<10)score-=8}if(f.eps!=null)score+=f.eps>0?6:-12;if(tone==='긍정 우위')score+=4;if(tone==='부정 우위')score-=6;if(p.risk==='high')score-=10;return Math.max(0,Math.min(100,Math.round(score)))}
function riskLevel(p,quote){let s=p.risk==='high'?60:p.risk==='mid'?40:25;s+=Math.min(Math.abs(+quote.dp||0)*5,25);return s>=70?'high':s>=45?'mid':'low'}

ines.join(NL+NL)}

html+='</div><div class="news-section"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="panel-title" style="margin-bottom:0">최근 뉴스</div><button class="btn-ghost" id="refreshNewsBtn" style="width:auto;min-height:auto;padding:7px 11px;font-size:12px">최신 뉴스 갱신</button></div><div id="newsBox" style="margin-top:12px"><div class="news-item">뉴스 불러오는 중...</div></div></div>';$('resultArea').innerHTML=html;document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{$('period').value=b.dataset.period;analyze()});const nb=$('refreshNewsBtn');if(nb)nb.onclick=()=>refreshNewsList(sym);const mb=$('refreshModeBtn');if(mb)mb.onclick=()=>refreshModeOnly();getAiModeAnalysis(sym,style,st,current,score,risk,avgForMode,pnlForMode,f,quote).then(txt=>{const box=$('modeAiBox');if(box)box.innerHTML=formatModeSections(esc(txt));requestAnimationFrame(scheduleChartResize)});requestAnimationFrame(()=>drawChart(candles,res,sym))}
function row(k,v,cls){return '<div class="data-row"><span class="key">'+esc(k)+'</span><span class="val '+(cls||'')+'">'+esc(v)+'</span></div>'}
function formatModeSections(text){const heads=['핵심 판단','차트 해석','펀더멘탈 해석','종합 의견','대응','리스크 체크','추가매수 판단'];let raw=String(text||'').split(String.fromCharCode(13)).join(''),lines=raw.split(NL).map(x=>x.trim()),out=[];lines.forEach(line=>{if(!line){if(out.length&&out[out.length-1]!=='')out.push('');return}let matched='';heads.forEach(h=>{if(line.indexOf(h+':')===0)matched=h});if(matched){const body=line.slice((matched+':').length).trim();if(out.length&&out[out.length-1]!=='')out.push('');out.push('<b>'+matched+':</b> '+body)}else out.push(line)});let clean=[];out.forEach(x=>{if(x===''&&clean[clean.length-1]==='')return;clean.push(x)});return clean.join(NL).split(NL+NL).join('<br><br>').split(NL).join('<br>')}
function hasCjkHan(text){return new RegExp('[㐀-鿿]').test(String(text||''))}

function polishAiSummary(text){let s=String(text||'').trim();s=s.split('**').join('').split('###').join('').split('• ').join('').split('- ').join('');s=s.replaceAll('입니다.','').replaceAll('있습니다.','있음.').replaceAll('보입니다.','보임.').replaceAll('가능성이 있습니다.','가능성 있음.').replaceAll('전망됩니다.','전망됨.').replaceAll('예상됩니다.','예상됨.');s=s.replaceAll('요약 :','요약:').replaceAll('의미 :','의미:').replaceAll('주가 영향 :','주가 영향:');s=s.replaceAll('요약:',NL+'요약:').replaceAll('의미:',NL+'의미:').replaceAll('주가 영향:',NL+'주가 영향:');return compactLines(s)}
function isBadAiSummary(text){const s=String(text||'').trim();return !s||s.startsWith('AI 요약 실패')||s.includes('AI 응답 없음')||s.includes('AI 호출 실패')||s.length<25}

function cacheKeyForNews(n){const raw=(n&&n.url?n.url:n&&n.headline?n.headline:'').trim();let h=0;for(let i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h|=0}return 'news_ai_cache_'+Math.abs(h)}
function getNewsCache(n){try{const key=cacheKeyForNews(n),raw=localStorage.getItem(key);if(!raw)return null;const data=JSON.parse(raw);if(!data||!data.summary||Date.now()-data.savedAt>259200000){localStorage.removeItem(key);return null}return data}catch(e){return null}}
function setNewsCache(n,result){try{if(result&&result.summary)localStorage.setItem(cacheKeyForNews(n),JSON.stringify({summary:result.summary,mode:(result.mode||'AI')+' · 캐시',savedAt:Date.now()}))}catch(e){}}
async function getAiNewsSummary(n){const cached=getNewsCache(n);if(cached)return{summary:cached.summary,mode:cached.mode};const headline=n&&n.headline?n.headline:'',url=n&&n.url?n.url:'';let articleText='';try{if(url){const article=await proxyJson('/article-text',{url:url,ts:Date.now()});articleText=article&&article.text?String(article.text).trim():''}}catch(e){}const hasBody=articleText.length>=300,base='반드시 한국어 한글로만 답변. 한자 금지. 마크다운 금지. 형식은 요약:, 의미:, 주가 영향: 3개만 사용.',bodyText=hasBody?base+NL+'뉴스 제목: '+headline+NL+'기사 본문:'+NL+smartArticleSlice(articleText):base+NL+'뉴스 제목: '+headline;try{let summary=await callAiSummary(bodyText);if(!isBadAiSummary(summary)&&!hasCjkHan(summary)){const result={summary,mode:hasBody?'본문 기반 AI':'제목 기반 AI'};setNewsCache(n,result);return result}}catch(e){}const fallback={summary:fallbackSummarize(headline),mode:'로컬 백업'};setNewsCache(n,fallback);return fallback}
function renderNewsCard(item){const n=item.news,date=n.datetime?new Date(n.datetime*1000).toLocaleDateString('ko-KR'):'날짜 없음',impact=classifyImpact(n.headline);return '<div class="news-headline">'+esc(translateHeadline(n.headline))+'</div><div class="news-meta"><span>'+esc(date)+'</span><span>'+esc(n.source||'출처 없음')+'</span><span>'+esc(item.mode||'AI')+'</span><span class="impact '+impact+'">영향 '+impact.toUpperCase()+'</span></div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">원문: '+esc(n.headline)+'</div><div class="news-summary">'+esc(item.summary)+'</div>'}
async function renderNews(news,offset){const raw=(news||[]).map(normalizeNews).filter(n=>n.headline),box=$('newsBox');if(!box)return;if(!raw.length){box.innerHTML='<div class="news-item" style="color:var(--muted)">뉴스를 가져오지 못했습니다.</div>';return}window.__lastNewsList=raw;window.__lastNewsOffset=Number(offset)||0;const start=window.__lastNewsOffset%raw.length;let candidates=raw.slice(start,start+5);if(candidates.length<5&&raw.length>5)candidates=candidates.concat(raw.slice(0,5-candidates.length));candidates=candidates.slice(0,5);box.innerHTML='<div class="news-item"><div class="news-headline">뉴스 종합</div><div class="news-summary">AI 요약을 각 카드별로 생성 중...<br>표시 뉴스 '+(start+1)+'번부터 최대 5개</div></div>'+candidates.map((n,i)=>'<div class="news-item" id="newsCard'+i+'"><div class="news-headline">'+esc(translateHeadline(n.headline))+'</div><div class="news-summary">AI 요약 생성 중...</div></div>').join('');let done=0,completed=[];candidates.forEach((n,i)=>{getAiNewsSummary(n).then(result=>{const item={news:n,summary:result.summary,mode:result.mode};completed.push(item);done++;const card=$('newsCard'+i);if(card)card.innerHTML=renderNewsCard(item);const first=box.querySelector('.news-item');if(first)first.innerHTML='<div class="news-headline">뉴스 종합</div><div class="news-summary">AI 요약 '+done+'/'+candidates.length+'건 완료<br>뉴스 톤: '+esc(newsTone(completed.map(x=>x.news)))+'</div>'})})}
